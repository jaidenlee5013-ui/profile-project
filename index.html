<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header>
        <h1>My Profile</h1>
        <nav>
            <a href="#about">about</a>
            <a href="#hobbies">hobbies</a>
            <a href="#skills">skills</a>
            <a href="#contact">contact</a>
        </nav>
    </header>
    <main>
        <section id="about" class="profile">
            <img src="/assets/person.png" alt="people">
            <div class="info">
                <h2>Hello I'm Jaiden</h2>
                <p>I'm a student from Sekolah Pelita Utama</p>
            </div>
        </section>
        <section id="hobbies" class="card">
            <h3>my hobbies</h3>
            <p>reading, gaming, swimming, and coding</p>
        </section>
        <section id="skills" class="card">
            <h3>my skills</h3>
            <p>HTML, CSS, Scratch, MIT App Inventor, and Python</p>
        </section>
        <section id="contact" class="card">
            <h3>get in touch</h3>
            <p>Email: jaiden@example.com</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Jaiden's Profile</p>
    </footer>
</body>
</html>
